[package]
name = "ab-script"
description = "Write April Blink Engine game scripts in Rust: loaded by any build of the editor and games"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["gamedev", "scripting", "april-blink"]
categories = ["game-development"]

[dependencies]
ab-script-api.workspace = true
# Math types for scripts (also what the engine uses, but nothing of the engine is linked).
glam.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Integration tests run scripts in a real engine, through the C ABI.
ab-engine.workspace = true

[lints]
workspace = true
