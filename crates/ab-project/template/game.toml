title = "{{title}}"
# The scene the game starts with, in assets/.
main_scene = "scenes/main.abscene"
# The input map, next to this file.
input = "input.toml"
# Named values for scripts (Player.MoveSpeed, …), next to this file.
config = "config.toml"
# Images, models and sounds are kept compressed in packed-assets/, stored with Git LFS.
# Set to false to keep them in git itself (a git server without Git LFS).
asset_lfs = true

[window]
width = 1280
height = 720

# Languages: assets/locales/<code>.toml; the first is the base the others fall back to.
[localization]
languages = ["en", "th"]
